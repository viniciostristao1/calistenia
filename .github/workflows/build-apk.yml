name: Build APK

# Gera o APK de teste na nuvem a cada push no app (a VPS é fraca p/ compilar Android).
# Por enquanto o release é assinado com a chave de DEBUG (instala direto no celular,
# sem keystore). Ao ir para a Play Store, adicionamos a keystore de upload via secrets.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # criar/atualizar releases
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7

      - name: Firebase (google-services.json + firebase_options.dart)
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/android/app/google-services.json
          echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 -d > app/lib/firebase_options.dart

      - name: Assinatura de release (keystore + key.properties)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/android/app/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Dependências
        working-directory: app
        run: flutter pub get

      - name: Build APK (release, por arquitetura)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      # Publica os APKs direto num Release (assets de release NÃO contam na cota
      # de artefatos do Actions — que é limitada e vivia estourando). O tag vem
      # da versão do pubspec; o release é criado ou atualizado (idempotente).
      - name: Publica o Release com os APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version:' app/pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          TAG="v$VER"
          APKS=$(ls app/build/app/outputs/flutter-apk/*-release.apk)
          echo "Publicando $TAG com: $APKS"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $APKS -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" $APKS -R "$GITHUB_REPOSITORY" \
              --title "Calis Timer $TAG" \
              --notes "APKs por arquitetura. Instale o app-arm64-v8a-release.apk (celulares modernos) por cima do app."
          fi
