name: calistenia
description: "Cronômetros de treino de calistenia — preparação, execução, descanso e repetições."
publish_to: 'none'

# versionName+versionCode. Ex.: 0.1.0+1 → versionName "0.1.0", versionCode 1.
version: 0.19.0+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2       # estado
  shared_preferences: ^2.3.2     # persistência local (sem login/nuvem)
  wakelock_plus: ^1.2.8          # mantém a tela ligada durante o treino
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.7.1
  audioplayers: ^6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/sounds/beep.wav
    - assets/sounds/fim.wav

# Ícone do app (cronômetro minimalista, azul degradê). A arte é gerada por
# tools/gerar_icone.py; rode `dart run flutter_launcher_icons` após alterá-la.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_full.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
